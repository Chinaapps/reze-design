name: Build reze-design

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: build-dummy-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inspect build output
        run: |
          echo "PWD=$(pwd)"
          ls -la
          echo "--- look for BUILD_ID ---"
          find . -maxdepth 4 -name BUILD_ID
          echo "--- .next listing ---"
          ls -la .next || echo "no .next dir"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: reze-design-next-build
          path: .next/
          include-hidden-files: true
          retention-days: 7
